<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="media/logo.png" alt="Logo Boutique" style="height:40px;vertical-align:middle;">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="connexion.html">Connexion</a></li>
            <li><a href="boutique.html">Boutique</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="apropos.html">À propos</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="theme-toggle">
            <input type="checkbox" id="theme-toggle" class="theme-toggle-input" aria-label="Changer de thème">
            <label for="theme-toggle" class="theme-toggle-label"><span>☀️</span><span>🌙</span></label>
        </div>
    </nav>
    <main>
        <section class="contact-section">
            <h2>Contactez-nous</h2>
            <form class="contact-form">
                <label for="nom">Nom et Prénom</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom et prénom" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Votre email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Votre message" required></textarea>
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <a href="mailto:VraiesFaussesPortes@vraimail.fr" class="footer-link">
            &copy; 2026 Jouvel Ethan
        </a>
    </footer>
</body>

</html>
